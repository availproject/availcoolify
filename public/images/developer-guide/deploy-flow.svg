<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
  <title id="t">From push to live app, and pull request previews</title>
  <desc id="d">Pushing to the app branch builds and deploys the app at its apps.avail.tools URL. Opening a pull request builds a private preview behind the Clerk login; merging or closing the pull request removes it.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b8b93" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="300" rx="14" fill="#161618"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="32" y="44" font-size="13" fill="#8b8b93">Branch deploy</text>
    <rect x="32" y="60" width="200" height="64" rx="8" fill="#1f2a37" stroke="#3b82f6"/>
    <text x="132" y="87" font-size="14" font-weight="600" fill="#e5e7eb" text-anchor="middle">Push to main</text>
    <text x="132" y="107" font-size="12" fill="#9ca3af" text-anchor="middle">or click Deploy</text>
    <line x1="232" y1="92" x2="276" y2="92" stroke="#8b8b93" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="280" y="60" width="200" height="64" rx="8" fill="#1f2a37" stroke="#3b82f6"/>
    <text x="380" y="87" font-size="14" font-weight="600" fill="#e5e7eb" text-anchor="middle">Build (Railpack)</text>
    <text x="380" y="107" font-size="12" fill="#9ca3af" text-anchor="middle">Deployments tab shows log</text>
    <line x1="480" y1="92" x2="524" y2="92" stroke="#8b8b93" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="528" y="60" width="200" height="64" rx="8" fill="#0f2e26" stroke="#10b981"/>
    <text x="628" y="87" font-size="14" font-weight="600" fill="#e5e7eb" text-anchor="middle">Live over HTTPS</text>
    <text x="628" y="107" font-size="12" fill="#9ca3af" text-anchor="middle">app.apps.avail.tools</text>

    <text x="32" y="170" font-size="13" fill="#8b8b93">Pull request preview</text>
    <rect x="32" y="186" width="200" height="64" rx="8" fill="#2a2140" stroke="#8b5cf6"/>
    <text x="132" y="213" font-size="14" font-weight="600" fill="#e5e7eb" text-anchor="middle">Open a PR</text>
    <text x="132" y="233" font-size="12" fill="#9ca3af" text-anchor="middle">same repo, not a fork</text>
    <line x1="232" y1="218" x2="276" y2="218" stroke="#8b8b93" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="280" y="186" width="200" height="64" rx="8" fill="#2a2140" stroke="#8b5cf6"/>
    <text x="380" y="213" font-size="14" font-weight="600" fill="#e5e7eb" text-anchor="middle">Preview + PR check</text>
    <text x="380" y="233" font-size="12" fill="#9ca3af" text-anchor="middle">7.app.apps.avail.tools</text>
    <line x1="480" y1="218" x2="524" y2="218" stroke="#8b8b93" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="528" y="186" width="200" height="64" rx="8" fill="#26262b" stroke="#6b7280"/>
    <text x="628" y="213" font-size="14" font-weight="600" fill="#e5e7eb" text-anchor="middle">Merge or close</text>
    <text x="628" y="233" font-size="12" fill="#9ca3af" text-anchor="middle">preview is removed</text>
    <text x="380" y="276" font-size="12" fill="#9ca3af" text-anchor="middle">Previews always ask for the Clerk login (team members only)</text>
  </g>
</svg>
